# markdownlint-cli2 configuration (run through pre-commit).
config:
  default: true
  MD013: false # long lines: tables and links are common in specs and ADRs
  MD024:
    siblings_only: true # allow repeated headings in different sections
  MD033:
    allowed_elements: [br, details, summary, img, a, picture, source, sub, sup]
ignores:
  - ".specify/**"
  - ".claude/**"
  - ".agents/**"
  - "CHANGELOG.md" # generated by release-please
  - "docs/agent/pr-bodies/**" # GitHub PR descriptions start at "## Summary"
  - "**/node_modules/**"
