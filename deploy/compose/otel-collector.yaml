receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
processors:
  batch: {timeout: 1s}
exporters:
  debug: {verbosity: basic}
  otlphttp/tempo:
    endpoint: http://tempo:4318
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
service:
  pipelines:
    traces: {receivers: [otlp], processors: [batch], exporters: [debug, otlphttp/tempo]}
    logs: {receivers: [otlp], processors: [batch], exporters: [debug, otlphttp/loki]}
