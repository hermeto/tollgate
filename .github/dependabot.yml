# Weekly grouped dependency updates with Conventional Commit prefixes.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/tools"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      go-modules:
        patterns: ["*"]
  # Python report generator (report/, feature 017); no-op until report/uv.lock exists.
  - package-ecosystem: uv
    directory: /report
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      docker:
        patterns: ["*"]
