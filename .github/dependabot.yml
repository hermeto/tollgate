# Weekly grouped dependency updates with Conventional Commit prefixes.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/tools", "/test/sdk/go"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      go-modules:
        patterns: ["*"]
  # Python: SDK compatibility clients now, report generator (report/) from feature 017.
  - package-ecosystem: uv
    directories: ["/test/sdk/python", "/report"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /test/sdk/node
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      docker:
        patterns: ["*"]
